

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aquastorm — Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: Inter, Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 20% 20%, #087ea4 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #0050a8 0%, transparent 35%),
        linear-gradient(135deg, #020b1a, #031d35, #00111f);
    }

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }

    .bubble {
      position: absolute;
      bottom: -100px;
      border-radius: 50%;
      background: rgba(80, 220, 255, 0.12);
      border: 1px solid rgba(150, 240, 255, 0.2);
      animation: rise linear infinite;
    }

    .bubble:nth-child(1) {
      width: 80px;
      height: 80px;
      left: 10%;
      animation-duration: 12s;
    }

    .bubble:nth-child(2) {
      width: 35px;
      height: 35px;
      left: 30%;
      animation-duration: 8s;
      animation-delay: 2s;
    }

    .bubble:nth-child(3) {
      width: 110px;
      height: 110px;
      left: 65%;
      animation-duration: 15s;
      animation-delay: 1s;
    }

    .bubble:nth-child(4) {
      width: 45px;
      height: 45px;
      left: 85%;
      animation-duration: 10s;
      animation-delay: 4s;
    }

    @keyframes rise {
      from {
        transform: translateY(0);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      to {
        transform: translateY(-120vh);
        opacity: 0;
      }
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(90%, 760px);
      padding: 70px 40px;
      text-align: center;
      border: 1px solid rgba(120, 220, 255, 0.2);
      border-radius: 32px;
      background: rgba(3, 25, 45, 0.55);
      backdrop-filter: blur(20px);
      box-shadow:
        0 30px 100px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .logo {
      display: inline-block;
      margin-bottom: 25px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #66e5ff;
    }

    h1 {
      font-size: clamp(3rem, 9vw, 6.5rem);
      line-height: 0.95;
      letter-spacing: -5px;
      margin-bottom: 25px;
      background: linear-gradient(90deg, #ffffff, #72eaff, #4ca8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      max-width: 560px;
      margin: auto;
      color: #b9d5e5;
      font-size: clamp(1rem, 2vw, 1.25rem);
      line-height: 1.7;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 35px;
      padding: 12px 20px;
      border-radius: 999px;
      color: #a9edff;
      background: rgba(60, 190, 240, 0.1);
      border: 1px solid rgba(80, 210, 255, 0.2);
      font-size: 14px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #52e3ff;
      box-shadow: 0 0 15px #52e3ff;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      50% {
        opacity: 0.35;
        transform: scale(0.7);
      }
    }

    footer {
      position: fixed;
      bottom: 20px;
      color: rgba(180, 220, 235, 0.45);
      font-size: 12px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <div class="background">
    <div class="bubble"></div>

    <div class="bubble"></div>
    <div class="bubble"></div>
  </div>

  <main class="card">
    <div class="logo">AQUAstorm - inspired by Aquaspark</div>

    <h1>
      We're<br />
      Cooking indomie
    </h1>

    <p>
      Spark (Munachi) is brewing sth beneath the surface.
      <br />
      <strong>Aquastorm is cooking Bitter leaf soup without ginger. ANTICIPATE.</strong>
    </p>

    <div class="status">
      <span class="dot"></span>
      Coming when Gospel pays 10million naira
    </div>
  </main>

  <footer>
    AQUASTORM is bankrupt • Website down till further notice lol
  </footer>

</body>
</html>
